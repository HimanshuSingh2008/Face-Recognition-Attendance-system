<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Verification - CampusAttend</title>

    <!-- Standard Inter Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Enterprise Design System -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="standalone-container">
        <div class="standalone-content-card" style="max-width: 820px;">
            
            <!-- Top Navigation & Branding Bar -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--color-card-border); flex-wrap: wrap; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="brand-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 style="font-size: 1.15rem; font-weight: 700; color: var(--color-text-primary); margin: 0;">Attendance Station</h1>
                        <p style="font-size: 0.8rem; color: var(--color-text-muted); margin: 0;">Live optical face recognition for automated attendance logging</p>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" class="btn btn-secondary" onclick="location.href='dashboard.html'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Dashboard</span>
                    </button>
                    <button type="button" class="btn btn-secondary" id="homeButton">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Home</span>
                    </button>
                </div>
            </div>

            <!-- CAMERA VIEWPORT (Preserving ID cameraStage) -->
            <div class="camera-stage" id="cameraStage" style="margin-bottom: 20px;">
                <!-- Face Alignment Box -->
                <div class="face-reticle" id="faceReticle"></div>

                <!-- Video Element (Preserving ID) -->
                <video id="video" autoplay muted playsinline></video>

                <!-- Hidden Canvas (Preserving ID) -->
                <canvas id="canvas" style="display: none;"></canvas>
            </div>

            <!-- CONTROLS & ACTIONS -->
            <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
                <button type="button" class="btn btn-primary" id="recognize" style="flex: 2;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                    </svg>
                    <span>Recognize Face & Mark Attendance</span>
                </button>

                <button type="button" class="btn btn-secondary" onclick="location.href='records.html'" style="flex: 1;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span>Attendance Records</span>
                </button>
            </div>

            <!-- RESULT MESSAGE CONTAINER (Preserving ID) -->
            <div id="result" class="status-callout" aria-live="polite" style="margin-bottom: 20px;">
                <span>Initializing camera sensor...</span>
            </div>

            <!-- STUDENT IDENTIFICATION CARD (Preserving all IDs) -->
            <div id="studentCard" class="recognized-student-hud" hidden>
                <div class="recognized-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Attendance Recorded</span>
                </div>

                <div class="recognized-profile-row" style="margin-top: 6px;">
                    <div class="recognized-avatar" id="avatarBox">
                        <span id="avatarInitials">ST</span>
                    </div>
                    <div class="recognized-meta">
                        <h4 id="studentName">Student Name</h4>
                        <div class="meta-roll">Roll Number: <span id="studentRoll">0000</span></div>
                    </div>
                </div>

                <div class="recognized-details-grid">
                    <div class="detail-item">
                        <span class="label">System Database ID</span>
                        <span class="value" id="studentId">#0</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Verification Status</span>
                        <span class="value" style="color: var(--color-success);">Present (Biometric Match)</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Core Attendance JS Logic -->
    <script src="js/attendance.js"></script>
</body>
</html>
