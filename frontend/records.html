<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records - CampusAttend</title>

    <!-- Standard Inter Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Enterprise Design System -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="standalone-container">
        <div class="standalone-content-card" style="max-width: 1040px;">
            
            <!-- Top Header & Navigation -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--color-card-border); flex-wrap: wrap; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="brand-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </div>
                    <div>
                        <h1 style="font-size: 1.15rem; font-weight: 700; color: var(--color-text-primary); margin: 0;">Attendance Records Ledger</h1>
                        <p style="font-size: 0.8rem; color: var(--color-text-muted); margin: 0;">Comprehensive verification log of all recorded attendance sessions</p>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" class="btn btn-secondary" onclick="location.href='dashboard.html'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Dashboard</span>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Home</span>
                    </button>
                </div>
            </div>

            <!-- CONTROLS & TOOLBAR -->
            <div class="table-toolbar" style="border: 1px solid var(--color-card-border); border-radius: var(--radius-md) var(--radius-md) 0 0; background: #ffffff;">
                <div class="table-title-group">
                    <div id="message" style="font-size: 0.85rem; color: var(--color-text-secondary); font-weight: 500;">
                        Loading records...
                    </div>
                </div>

                <div class="table-filters">
                    <div class="table-search-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="recordsSearch" placeholder="Search by name, roll, or date...">
                    </div>

                    <select class="filter-select" id="statusFilter">
                        <option value="ALL">All Statuses</option>
                        <option value="Present">Present Only</option>
                        <option value="Absent">Absent Only</option>
                    </select>

                    <button type="button" class="btn btn-secondary" id="exportCsvBtn" title="Export records to CSV">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>Export CSV</span>
                    </button>

                    <button type="button" class="btn btn-primary" id="refreshButton">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"></path>
                        </svg>
                        <span>Refresh</span>
                    </button>
                </div>
            </div>

            <!-- TABLE CONTAINER (Preserving IDs: attendanceTable & attendanceBody) -->
            <div class="table-responsive" style="border: 1px solid var(--color-card-border); border-top: none; border-radius: 0 0 var(--radius-md) var(--radius-md);">
                <table class="admin-table" id="attendanceTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable('name')">Student Name <span>↕</span></th>
                            <th onclick="sortTable('roll_number')">Roll Number <span>↕</span></th>
                            <th onclick="sortTable('attendance_date')">Date <span>↕</span></th>
                            <th onclick="sortTable('attendance_time')">Time <span>↕</span></th>
                            <th onclick="sortTable('status')">Status <span>↕</span></th>
                        </tr>
                    </thead>
                    <tbody id="attendanceBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 36px; color: var(--color-text-muted);">
                                Loading records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Core Records Logic -->
    <script src="js/records.js"></script>
</body>
</html>
