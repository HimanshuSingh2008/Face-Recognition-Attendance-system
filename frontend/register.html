<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Student</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <h1>Register Student</h1>

    <br>

    <input
        type="text"
        id="name"
        placeholder="Enter Student Name"
    >

    <br><br>

    <input
        type="text"
        id="roll"
        placeholder="Enter Roll Number"
    >

    <br><br>

    <video
        id="video"
        width="400"
        height="300"
        autoplay>
    </video>

    <br><br>

    <button id="capture">
        Capture Face
    </button>

    <canvas
        id="canvas"
        style="display:none;">
    </canvas>

    <p id="message"></p>

</div>

<script src="js/register.js"></script>

</body>

</html>
