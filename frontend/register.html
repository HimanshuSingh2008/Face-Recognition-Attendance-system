<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment - CampusAttend</title>

    <!-- Standard Inter Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Enterprise Design System -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="standalone-container">
        <div class="standalone-content-card" style="max-width: 860px;">
            
            <!-- Top Header & Navigation -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--color-card-border); flex-wrap: wrap; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="brand-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                    </div>
                    <div>
                        <h1 style="font-size: 1.15rem; font-weight: 700; color: var(--color-text-primary); margin: 0;">Student Biometric Registration</h1>
                        <p style="font-size: 0.8rem; color: var(--color-text-muted); margin: 0;">Enroll student credentials and capture optical face data</p>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" class="btn btn-secondary" onclick="location.href='dashboard.html'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Dashboard</span>
                    </button>
                    <button type="button" class="btn btn-secondary" id="homeButton">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>Home</span>
                    </button>
                </div>
            </div>

            <!-- FEEDBACK MESSAGE (Preserving ID) -->
            <div id="message" class="status-callout" aria-live="polite" style="margin-bottom: 20px;">
                <span>Fill in credentials, face camera, and click Capture Face & Enroll Student.</span>
            </div>

            <!-- ENROLLMENT FORM & CAMERA GRID -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                
                <!-- Left: Live Optical Viewport -->
                <div>
                    <label style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 8px;">
                        Camera Optical Viewport
                    </label>
                    <div class="camera-stage active" id="registerCameraStage" style="aspect-ratio: 4 / 3; max-height: 280px;">
                        <div class="face-reticle"></div>
                        <video id="video" autoplay muted playsinline></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                    </div>
                    <div id="cameraError" class="camera-error" style="color: var(--color-danger); font-size: 0.8rem; margin-top: 6px;"></div>
                </div>

                <!-- Right: Student Metadata Input Fields -->
                <div style="display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <div class="form-group-clean">
                            <label for="name">Student Full Name</label>
                            <input type="text" id="name" placeholder="e.g. Alex Morgan" autocomplete="off">
                        </div>

                        <div class="form-group-clean">
                            <label for="roll">Roll Number / Student ID</label>
                            <input type="text" id="roll" placeholder="e.g. CS2026-088" autocomplete="off">
                        </div>
                    </div>

                    <div>
                        <button type="button" class="btn btn-primary" id="capture" style="width: 100%; margin-bottom: 10px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <span>Capture Face & Enroll Student</span>
                        </button>

                        <button type="button" class="btn btn-secondary" onclick="location.href='attendance.html'" style="width: 100%;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                            </svg>
                            <span>Open Attendance Station</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- SUCCESS STUDENT INFO READOUT (Preserving all IDs) -->
            <div id="studentInfo" class="verified-record-box" hidden>
                <div class="verified-header">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Student Successfully Enrolled</span>
                </div>

                <div class="verified-meta-grid">
                    <div class="verified-meta-item">
                        <span class="label">Enrolled Student</span>
                        <span class="value" id="registeredName">--</span>
                    </div>
                    <div class="verified-meta-item">
                        <span class="label">Roll Number</span>
                        <span class="value" id="registeredRoll">--</span>
                    </div>
                    <div class="verified-meta-item">
                        <span class="label">Database Record ID</span>
                        <span class="value" id="registeredId">--</span>
                    </div>
                    <div class="verified-meta-item">
                        <span class="label">Face Biometrics</span>
                        <span class="value" style="color: var(--color-success);">Extracted & Stored</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Core Registration Logic -->
    <script src="js/register.js"></script>
</body>
</html>
