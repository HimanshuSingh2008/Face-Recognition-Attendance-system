<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Student - Face Attendance</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Register Student</h1>

        <p>
            Register a student using face recognition
        </p>


        <!-- Student Name -->

        <div class="form-group">

            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter student name"
                autocomplete="off"
            >

        </div>


        <!-- Roll Number -->

        <div class="form-group">

            <label for="roll">

                Roll Number

            </label>

            <input
                type="text"
                id="roll"
                placeholder="Enter roll number"
                autocomplete="off"
            >

        </div>


        <!-- Camera -->

        <div class="camera-container">

            <video
                id="video"
                width="500"
                height="375"
                autoplay
                playsinline>
            </video>

        </div>


        <!-- Capture Button -->

        <button
            type="button"
            id="capture">

            Capture & Register

        </button>


        <!-- Hidden Canvas -->

        <canvas
            id="canvas"
            width="500"
            height="375"
            style="display: none;">
        </canvas>


        <!-- Status Message -->

        <div
            id="message"
            class="message">

        </div>


        <!-- Student Information -->

        <div
            id="studentInfo"
            class="student-info"
            style="display: none;">

            <h3>Registration Successful</h3>

            <p>
                <strong>Name:</strong>
                <span id="registeredName"></span>
            </p>

            <p>
                <strong>Roll Number:</strong>
                <span id="registeredRoll"></span>
            </p>

            <p>
                <strong>Student ID:</strong>
                <span id="registeredId"></span>
            </p>

        </div>


        <!-- Back Button -->

        <button
            type="button"
            onclick="window.location.href='index.html'">

            Back to Home

        </button>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
