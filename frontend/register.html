<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Student</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Register Student</h1>

        <p>Register a student using face recognition</p>


        <!-- Student Name -->

        <div class="form-group">

            <label for="name">
                Student Name
            </label>

            <input type="text" id="name" placeholder="Enter student name">

        </div>


        <!-- Roll Number -->

        <div class="form-group">

            <label for="roll">
                Roll Number
            </label>

            <input type="text" id="roll" placeholder="Enter roll number">

        </div>


        <!-- Webcam -->

        <div class="camera-container">

            <video id="video" width="500" height="375" autoplay playsinline>
            </video>

        </div>


        <!-- Capture -->

        <button type="button" id="capture">

            Capture & Register

        </button>


        <!-- Canvas -->

        <canvas id="canvas" style="display:none;">
        </canvas>


        <!-- IMPORTANT -->

        <div id="message" class="message">
        </div>


        <!-- SUCCESS INFORMATION -->

        <div id="studentInfo" class="student-info" style="display:none;">

            <h2>Registration Successful</h2>

            <p>
                <strong>Name:</strong>
                <span id="registeredName"></span>
            </p>

            <p>
                <strong>Roll Number:</strong>
                <span id="registeredRoll"></span>
            </p>

            <p>
                <strong>Student ID:</strong>
                <span id="registeredId"></span>
            </p>

        </div>


        <br>

        <button type="button" onclick="window.location.href='index.html'">

            Back to Home

        </button>

    </div>


    <!-- VERY IMPORTANT -->

    <script src="js/register.js"></script>

</body>

</html>
